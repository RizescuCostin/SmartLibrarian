[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-librarian"
version = "0.1.0"
description = "An AI book recommendation chatbot using OpenAI, RAG, ChromaDB, and tool calling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "chromadb",
    "python-dotenv",
    "pydantic>=2",
    "streamlit"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
smart-librarian = "smart_librarian.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"